name: 'cleaner'
description: 'cleaner'
author: apois

inputs:
  cloudflare_account_id:
    description: ''
    required: false

  cloudflare_api_token:
    description: ''
    required: false

  project_name:
    description: ''
    required: false
    default: ''

  delete_deployments_days:
    description: ''
    required: false
    default: '7'

  delete_releases_days:
    description: ''
    required: false
    default: '7'

  enable_delete_preview:
    description: ''
    required: false
    default: 'false'

  enable_delete_deployments:
    description: ''
    required: false
    default: 'false'

  enable_delete_releases:
    description: ''
    required: false
    default: 'false'
    
runs:
  using: 'composite'
  steps:
    - name: Set timezone
      shell: bash
      run: |
        echo "::group::Set timezone"
        sudo timedatectl set-timezone Asia/Shanghai
        date +"%Y-%m-%d %H:%M:%S %:z"
        echo "::endgroup::"

    - name: Delete skipped deployments
      if: inputs.enable_delete_preview == 'true'
      shell: bash
      run: |

        date +"%Y-%m-%d %H:%M:%S %:z"

        cloudflare_account_id="${{ inputs.cloudflare_account_id }}"
        cloudflare_api_token="${{ inputs.cloudflare_api_token }}"

        IFS=$' \t\n,;' read -r -a projects <<< "${{ inputs.project_name }}"

        if [ ${#projects[@]} -eq 0 ] || [ -z "${projects[0]}" ]; then
          echo "no project_name provided, Skip cleaning."
          exit 0
        fi

        auth_header="Authorization: Bearer $cloudflare_api_token"

        for project_name in "${projects[@]}"; do

          echo "────────────────────────────────────────"
          echo "Project: $project_name"

          if [[ -z "$project_name" ]]; then
            continue
          fi

          api_base="https://api.cloudflare.com/client/v4/accounts/$cloudflare_account_id/pages/projects/$project_name"

          response=$(curl -s -H "$auth_header" "$api_base/deployments" || echo '{"result":null}')

          if ! echo "$response" | jq -e .result >/dev/null 2>/dev/null; then
            echo "project query failed."
            continue
          fi

          skipped_ids=$(echo "$response" | jq -r '.result[] | select(.is_skipped == true) | .id' 2>/dev/null || echo "")

          if [ -z "$skipped_ids" ]; then
            echo "not found, skip."
            continue
          fi

          total_cleaned=0

          for id in $skipped_ids; do
            [ -z "$id" ] && continue

            echo -n "cleaning $id ... "

            delete_output=$(curl -s -w "\n%{http_code}" -X DELETE -H "$auth_header" "$api_base/deployments/$id" 2>&1 || echo "")

            http_code=$(echo "$delete_output" | tail -n1 2>/dev/null || echo "unknown")
            body=$(echo "$delete_output" | sed '$d' 2>/dev/null)

            if [[ "$http_code" =~ ^2 ]]; then
              echo "OK (HTTP $http_code)"
              ((total_cleaned++))
              sleep 1
            else
              echo "FAILED (HTTP $http_code)"
              if [ -n "$body" ]; then
                echo "     $body" | sed 's/^/     /'
              fi
            fi
          done || true

          echo "Total cleaned: $total_cleaned"

        done || true

        exit 0

    - name: Delete outdated deployments
      if: inputs.enable_delete_deployments == 'true'
      shell: bash
      run: |

        date +"%Y-%m-%d %H:%M:%S %:z"

        cloudflare_account_id="${{ inputs.cloudflare_account_id }}"
        cloudflare_api_token="${{ inputs.cloudflare_api_token }}"

        days_input="${{ inputs.delete_deployments_days }}"
        days="${days_input:-7}"

        if ! [[ "$days" =~ ^[0-9]+$ ]]; then
          echo "error: delete_deployments_days must be a valid integer, received: '$days'"
          exit 1
        fi

        echo "Deployment retention days: $days"

        ifs=$' \t\n,;' read -r -a projects <<< "${{ inputs.project_name }}"

        if [ ${#projects[@]} -eq 0 ] || [ -z "${projects[0]}" ]; then
          echo "no project_name provided, skip cleaning."
          exit 0
        fi

        auth_header="Authorization: Bearer $cloudflare_api_token"

        for project_name in "${projects[@]}"; do

          [[ -z "$project_name" ]] && continue

          echo "────────────────────────────────────────"
          echo "Project: $project_name"

          api_base="https://api.cloudflare.com/client/v4/accounts/$cloudflare_account_id/pages/projects/$project_name"

          canonical_response=$(curl -s -H "$auth_header" "$api_base" || echo '{"success":false}')

          if ! echo "$canonical_response" | jq -e '.success' >/dev/null 2>/dev/null; then
            echo "project query failed."
            continue
          fi

          production_id=$(echo "$canonical_response" | jq -r '.result.canonical_deployment.id // empty')

          current_time=$(date -u +%s)
          cutoff_time=$((current_time - (days * 86400)))

          page=1
          total_cleaned=0
          found_old=0

          while true; do

            deployments_resp=$(curl -s -H "$auth_header" \
              "$api_base/deployments?page=$page" || echo '{"success":false,"result":[]}')

            if ! echo "$deployments_resp" | jq -e '.success' >/dev/null 2>/dev/null; then
              echo "failed to fetch deployments page $page, stopping"
              break
            fi

            result=$(echo "$deployments_resp" | jq '.result')
            result_count=$(echo "$result" | jq 'length' 2>/dev/null || echo 0)

            [ "$result_count" -eq 0 ] && break

            for i in $(seq 0 $((result_count - 1))); do
              id=$(echo "$result" | jq -r ".[$i].id")
              created_on=$(echo "$result" | jq -r ".[$i].created_on")

              if [ "$id" = "$production_id" ]; then
                continue
              fi

              created_on_clean=$(echo "$created_on" | sed 's/\.[0-9]\+Z$//; s/Z$//')

              created_time=$(date -u -d "$created_on_clean" +%s 2>/dev/null || echo "parse_failed")

              if [ "$created_time" = "parse_failed" ]; then
                echo "parse failed, skipped."
                continue
              fi

              if [ "$created_time" -lt "$cutoff_time" ]; then
                ((found_old++))

                echo -n "cleaning $id ... "

                delete_output=$(curl -s -w "\n%{http_code}" -X DELETE -H "$auth_header" \
                  "$api_base/deployments/$id?force=true" 2>&1 || echo "")

                http_code=$(echo "$delete_output" | tail -n1 2>/dev/null || echo "unknown")
                body=$(echo "$delete_output" | sed '$d' 2>/dev/null)

                if [[ "$http_code" =~ ^2 ]]; then
                  echo "OK (HTTP $http_code)"
                  ((total_cleaned++))
                  sleep 1
                else
                  echo "FAILED (HTTP $http_code)"
                  [ -n "$body" ] && echo "     $body" | sed 's/^/     /'
                fi
              fi
            done || true

            ((page++)) || true

          done || true

          echo "Total cleaned: $total_cleaned"

        done || true

        exit 0

    - name: Delete outdated releases
      if: inputs.enable_delete_releases == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |

        date +"%Y-%m-%d %H:%M:%S %:z"

        git fetch --tags
        
        days_input="${{ inputs.delete_releases_days }}"
        days="${days_input:-7}"
        
        if ! [[ "$days" =~ ^[0-9]+$ ]]; then
          echo "error: delete_releases_days must be a valid integer, received: '$days'"
          exit 1
        fi
        
        echo "Release retention days: $days"
        
        release_cutoff_time=$(date --date="-${days} days" +%s)
        
        if [ -z "$release_cutoff_time" ]; then
          echo "error: failed to calculate release cutoff time"
          exit 1
        fi

        gh release list --json tagName,createdAt,isDraft --limit 100 \
        | jq -r --argjson release_cutoff_time "$release_cutoff_time" '
            .[] | 
            select(
              ((.createdAt | fromdateiso8601) < $release_cutoff_time or .isDraft == true) and
              .tagName != "" and
              .tagName != null and
              (.tagName | type == "string")
            ) | 
            .tagName
        ' \
        | while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              for attempt in {1..3}; do
                if git tag --list | grep -Fx "$tag" > /dev/null; then
                  timeout 30s bash -c "gh release delete \"$tag\" --yes && git tag -d \"$tag\" && git push origin --delete refs/tags/\"$tag\"" && break || {
                    if [ $attempt -lt 3 ]; then sleep 2; fi
                  }
                else
                  timeout 30s gh release delete "$tag" --yes && break || {
                    if [ $attempt -lt 3 ]; then sleep 2; fi
                  }
                fi
              done
            fi
          done
